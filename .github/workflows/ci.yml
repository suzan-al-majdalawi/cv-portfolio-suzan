name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - m0

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Test + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

  docker:
    name: Docker → GHCR
    runs-on: ubuntu-latest
    needs: verify

    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set image
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${OWNER}/${REPO}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:${{ github.ref_name }}" \
            .

      - name: Push image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ github.ref_name }}"

  staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: docker

    if: github.ref == 'refs/heads/m0'

    steps:
      - name: Deploy to Render Staging
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        run: curl "$DEPLOY_HOOK"

  production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: docker

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Render Production
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}
        run: curl "$DEPLOY_HOOK"